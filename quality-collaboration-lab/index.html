function saveFile(name,text,type='application/json'){const blob=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
const titles={home:'總覽',drawiq:'01 工程圖重用',medical:'02 配對模擬',deployment:'03 部署驗收',report:'學習紀錄',sources:'證據與開源'};
function navigate(key){if(!titles[key])key='home';if(timer){clearInterval(timer);timer=null;}station=key;history.replaceState(null,'','#'+key);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===key?'page':'false'));render();window.scrollTo(0,0);}
function head(num,title,desc,badge='互動教學示例'){return `<div class="section-head"><div><div class="eyebrow">${num}</div><h1>${title}</h1><p>${desc}</p></div><span class="badge">${badge}</span></div>`;}
function quiz(id,question,answers,correct,explanation){return `<div class="quiz"><h3>${question}</h3>${answers.map((a,i)=>`<button class="btn" data-quiz="${id}" data-choice="${i}" data-correct="${correct}" data-explain="${esc(explanation)}">${a}</button>`).join('')}<p id="quiz-${id}" role="status">${session.answers[id]?esc(session.answers[id].feedback):''}</p></div>`;}
function bindQuiz(){document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{const correct=b.dataset.choice===b.dataset.correct,feedback=(correct?'判斷正確。':'再想一想。')+b.dataset.explain;session.answers[b.dataset.quiz]={choice:Number(b.dataset.choice),correct,feedback};$('quiz-'+b.dataset.quiz).textContent=feedback;event('answer',{question:b.dataset.quiz,correct});});}
function render(){const renderers={home:home,drawiq:drawiq,medical:medical,deployment:deployment,report:report,sources:sources};$('app').innerHTML=renderers[station]();bindQuiz();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));({drawiq:bindDraw,medical:bindMedical,deployment:bindDeployment,report:bindReport,sources:bindSources}[station]||(()=>{}))();}
function home(){const done=Object.keys(session.results).length;return `<section class="hero"><div><div class="eyebrow">品質協作實驗室 · 研究衍生教學版</div><h1>讓系統做對事，<br>也讓人的工作更容易。</h1><p>從三個研究案例出發，親手找出不適用的修正、比較同一情境的機器反應，再驗收一份真正可交付的教材。</p><button class="hero-link" data-go="drawiq">從第一站開始 →</button><p class="note" style="color:#c3d3e2">免登入 · 不需 API 金鑰 · 全部互動在瀏覽器執行</p></div><div class="diagram"><div class="chain"><div><b>01</b><span>工程圖：建議適用於現在的要求嗎？</span></div><div><b>02</b><span>機器人：什麼條件才允許繼續動作？</span></div><div><b>03</b><span>教學：學員真的走得完整個流程嗎？</span></div></div><p style="font-size:13px">工作品質 ＋ 完整流程 ＋ 人的負荷</p></div></section><div class="cards"><section class="card"><div class="num">01 / TRACE</div><h2>DrawIQ<br>錯誤重用邊界</h2><p>切換上限、下限與衝突狀態，觀察規則為何可能通過，卻不適合提出建議。</p><span class="note">產出：判斷紀錄與待審狀態</span><button class="btn primary" data-go="drawiq">檢查一筆修正</button></section><section class="card"><div class="num">02 / VERIFY</div><h2>醫療器械<br>配對比較</h2><p>讓兩種配置面對相同障礙事件，觀察停止、恢復、碰撞與逾時。</p><span class="note">產出：24 組教學情境配對表</span><button class="btn primary" data-go="medical">執行配對體驗</button></section><section class="card"><div class="num">03 / DELIVER</div><h2>虛擬人教學平台<br>部署驗收</h2><p>看到 9/9 通過之後，再檢查全部 28 個教案，以及新機沒有的本機檔案。</p><span class="note">產出：驗收缺口與修正清單</span><button class="btn primary" data-go="deployment">找出部署缺陷</button></section></div><section class="panel"><h2>完成三站，帶走一份品質判斷紀錄</h2><div class="progress" aria-label="已執行 ${done} 個體驗"><span style="width:${done/3*100}%"></span></div><p>已執行 ${done}/3 站。可匯出本機活動 JSON、配對比較 CSV，或列印學習紀錄。結果不是能力認證，也不構成正式人因研究。</p><div class="flow"><div><b>問題發覺</b>從使用者遇到的困難開始</div><div><b>技術實作</b>把條件寫成可檢查規則</div><div><b>品質驗證</b>包含失敗、拒絕與例外</div><div><b>人機協作</b>檢查省下與新增的負擔</div></div></section><div class="callout warn"><b>資料分層：</b>歷史研究數值只供對照；本頁操作產生的是新的教學示例。沒有執行原 DrawIQ、MuJoCo、真機或正式臨床教學平台。</div>`;}
function drawing(t,label){return `<div class="drawing"><span class="note">${label}</span><svg viewBox="0 0 260 90" role="img" aria-label="合成零件示意圖"><rect x="45" y="20" width="150" height="42" fill="white" stroke="#173c61" stroke-width="2"/><circle cx="76" cy="41" r="10" fill="none" stroke="#173c61"/><path d="M195 41 L224 14 H250 M45 72 H195 M45 66 V79 M195 66 V79" fill="none" stroke="#173c61"/></svg><strong>${esc(t.operator)} ${esc(t.value)} ${esc(t.unit)}</strong><small>鍍層厚度 · ${esc(t.state||'present')}</small></div>`;}
function drawiq(){const s=Q.scenarios.find(x=>x.id===drawId);return head('STATION 01','修正能重用，但適用條件不能省略','先用歷史缺口示意檢查一筆建議，再加入運算子與內容狀態的檢查。數值為自製示例。')+`<div class="grid"><section class="panel"><h2>設定目標情境</h2><div class="field"><label for="draw-case">選擇案例</label><select id="draw-case">${Q.scenarios.map(x=>`<option value="${x.id}" ${x.id===drawId?'selected':''}>${x.name}</option>`).join('')}</select></div><p class="note">${s.description}</p><h3>採用的規則</h3><label class="check"><input id="check-source" type="checkbox" ${drawPolicy.source?'checked':''}>來源核准仍有效</label><label class="check"><input id="check-operator" type="checkbox" ${drawPolicy.operator?'checked':''}>比較運算子相符</label><label class="check"><input id="check-state" type="checkbox" ${drawPolicy.state?'checked':''}>目標狀態為 present</label><div class="btn-group"><button class="btn" id="draw-legacy">歷史缺口示意</button><button class="btn" id="draw-guarded">補強規則示意</button></div><button class="btn primary full" id="draw-evaluate">檢查是否提出建議</button><p class="note">這是規則摘要，不是 DrawIQ 0.4.8 完整重跑。補強規則在本教學版可執行，不代表原研究軟體已修補。</p></section><div class="stack"><section class="panel"><h2>來源經驗與目前目標</h2><div class="drawing-pair">${drawing(Q.source,'來源圖 A／原候選')}${drawing(s.target,'目標圖 B／目前候選')}</div><div class="endpoints"><span>來源核准修正：≥ 5 μm</span><span>前／後／核准三狀態保留</span><span>新目標仍需獨立覆核</span></div><div id="draw-result">${drawResult?drawResultHTML():'<div class="empty">按下「檢查」，看哪些條件真的進入判斷。</div>'}</div></section><section class="panel"><h2>把結果連到人的工作</h2><p>有來源可追查，仍要量測覆核時間、誤採納與最終關鍵欄位錯誤。少按幾次按鈕，不能單獨證明工作負荷降低。</p>${quiz('draw','哪一個結論最符合這個案例？',['只要曾經由人核准，就可自動核准新圖。','來源核准與新圖適用性需要分開確認。'],1,'有值、已採納與已核准是不同的狀態。')}</section></div></div>`;}
function drawResultHTML(){const r=drawResult;return `<div class="callout ${r.allowed?(r.uncheckedRisks.length?'warn':'success'):'bad'}" role="status"><b>${r.allowed?'產生候選建議：5 μm':r.referenceOnly?'僅提供證據參考；不複製幾何框':'停止建議，交回人工釐清'}</b><br>${r.uncheckedRisks.length?'未檢查的風險：'+r.uncheckedRisks.join('、'):(r.reasons.length?r.reasons.join('、'):'目標仍須自行覆核，未自動核准。')}</div><div class="table-scroll"><table><thead><tr><th>檢查</th><th>是否啟用</th><th>實際條件</th></tr></thead><tbody>${r.checks.map(c=>`<tr><td>${c.label}</td><td>${c.enabled?'納入判斷':'未納入'}</td><td class="status ${c.pass?'good':'bad'}">${c.pass?'符合':'不符合'}</td></tr>`).join('')}</tbody></table></div><div class="btn-group"><button class="btn teal" id="draw-adopt" ${r.allowed?'':'disabled'}>模擬採納並查看狀態</button></div>${adoption?`<div class="callout warn"><b>採納結果：已有內容，但仍待審。</b><br>內容狀態：${adoption.content_state}；審查：${adoption.review_status}；獨立核准：否。原始狀態 ${esc(adoption.original_content_state)} 與運算子 ${esc(adoption.original_operator)} 仍在活動紀錄保留。</div>`:''}`;}
function bindDraw(){function reset(){drawResult=null;adoption=null;render();} $('draw-case').onchange=e=>{drawId=e.target.value;reset();};['source','operator','state'].forEach(k=>$('check-'+k).onchange=e=>{drawPolicy[k]=e.target.checked;reset();});$('draw-legacy').onclick=()=>{drawPolicy={source:true,operator:false,state:false};reset();};$('draw-guarded').onclick=()=>{drawPolicy={source:true,operator:true,state:true};reset();};$('draw-evaluate').onclick=()=>{drawResult=Q.evaluateReuse(drawId,drawPolicy);adoption=null;session.results.drawiq=drawResult;event('evaluate_reuse',{scenario:drawId,policy:{...drawPolicy},allowed:drawResult.allowed});render();};if($('draw-adopt'))$('draw-adopt').onclick=()=>{adoption=Q.adopt(drawResult);session.results.drawiq={...drawResult,adoption};event('adopt',{...adoption});render();};}
function simSVG(id,title){return `<div class="sim"><h3>${title}</h3><svg viewBox="0 0 660 175" role="img" aria-label="${title}二維教學動畫"><defs><pattern id="grid-${id}" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#e5edf5"/></pattern></defs><rect width="660" height="175" fill="url(#grid-${id})"/><path d="M60 95H600" stroke="#a7b7c9" stroke-width="4" stroke-dasharray="6 6"/><circle cx="60" cy="95" r="8" fill="#55738f"/><rect x="585" y="68" width="35" height="52" rx="6" fill="#dceee6" stroke="#398563"/><text x="30" y="145" font-size="15" fill="#42586f">起點</text><text x="560" y="145" font-size="15" fill="#42586f">交接座</text><g id="obstacle-${id}" opacity="0"><rect x="312" y="45" width="36" height="80" rx="12" fill="#f3ae8c"/><text x="270" y="28" font-size="15" fill="#a04e21">助手佔區</text></g><g id="tool-${id}" transform="translate(60 95)"><circle r="17" fill="${id==='gate'?'#087d75':'#537799'}"/><path d="M-5 0H27" stroke="white" stroke-width="5" stroke-linecap="round"/></g></svg><p id="status-${id}" class="note">尚未執行</p></div>`;}
function medical(){return head('STATION 02','同一套情境，才能比較方法的差異','互動區是可檢查的二維教學運動模型；歷史 300 組物理模擬摘要另列，不混算。')+`<div class="grid"><section class="panel"><h2>配對情境</h2><div class="field"><label for="motion-case">事件種類</label><select id="motion-case">${Object.entries(Q.motionScenarios).map(([k,v])=>`<option value="${k}" ${motionKey===k?'selected':''}>${v.name}</option>`).join('')}</select></div><div class="field"><label for="latency">偵測延遲：<span id="latency-value">${latency.toFixed(2)}</span> 教學秒</label><input id="latency" type="range" min="0" max="1.2" step="0.05" value="${latency}"></div><p class="note">單位是螢幕像素與教學秒。未校正到真機，不可用於決定安全距離、速度或控制參數。</p><button class="btn primary full" id="motion-run">同時執行有／無閘門</button><div class="btn-group"><button class="btn" id="motion-pause">暫停動畫</button><button class="btn" id="motion-replay">重播結果</button></div><hr style="border:0;border-top:1px solid var(--line)"><h3>固定種子的配對批次</h3><div class="field"><label for="seed">情境種子（整數）</label><input id="seed" type="number" min="0" max="4294967295" value="${batch?batch.seed:20261113}"></div><button class="btn teal full" id="batch-run">執行 24 組教學情境</button><button class="btn full" style="margin-top:10px" id="batch-csv" ${batch?'':'disabled'}>匯出逐情境 CSV</button><div id="motion-error" role="alert"></div></section><div class="stack"><section class="panel"><div class="pill warn">二維教學示例／非 MuJoCo、非 PPO、非真機</div><div class="two" style="margin-top:14px">${simSVG('gate','有執行閘門')}${simSVG('open','無執行閘門')}</div><label class="field" for="motion-time">逐時刻檢查<input class="timeline" id="motion-time" type="range" min="0" max="14" step="0.025" value="0"></label><p id="motion-caption" class="note">兩邊使用同一事件、初始位置與延遲，僅改變執行監督。</p><div id="batch-result">${batch?batchHTML():''}</div></section><section class="panel"><h2>歷史研究結果：只作來源對照</h2><p class="note">來源：2026-11-02 醫械智取隊修訂稿表 15。每條件 300 組配對情境，既有 RRT-Connect 閉迴路物理模擬。這裡不含原始逐試次資料，也未重算配對顯著性。</p><div class="table-scroll"><table><thead><tr><th>條件／配置</th><th>成功率</th><th>模擬不安全率</th><th>原報均時</th></tr></thead><tbody>${Q.historical.conditions.map(c=>c.rows.filter(r=>['C','D','E'].includes(r[0])).map(r=>`<tr><td>${c.name} ${r[0]}</td><td>${r[1].toFixed(1)}%</td><td>${r[2].toFixed(1)}%</td><td>${r[3].toFixed(1)} 秒</td></tr>`).join('')).join('')}</tbody></table></div><p class="note">C＝人工複核流程＋閘門；D＝主動近拍＋閘門；E＝主動近拍、無閘門。歷史均時的成功／失敗分母未在此獨立確認，不能直接換算真人減負。</p>${quiz('medical','五種配置共用 300 組情境，應如何解讀？',['1,500 次執行就是 1,500 個獨立樣本。','保留情境配對，逐組比較方法差異。'],1,'執行次數、獨立情境與真人受試者數是不同單位。')}</section></div></div>`;}
const statusNames={success:'抵達目標',unsafe_event:'出現教學模型的碰撞事件',timeout:'等待逾時，任務中止'};
function paintMotion(t){if(!pair)return;['gate','open'].forEach(k=>{const r=pair[k],f=r.trace[Math.min(Math.floor(t/.025),r.trace.length-1)];$('tool-'+k).setAttribute('transform',`translate(${f.x} 95)`);$('obstacle-'+k).setAttribute('opacity',f.active?'1':'0');$('obstacle-'+k).setAttribute('transform',`translate(${r.spec.obstacle-330} 0)`);$('status-'+k).textContent=t>=r.time?`${statusNames[r.status]}｜${r.time.toFixed(2)} 教學秒｜介入 ${r.interventions} 次`:`${f.brake?(f.v<1?'等待解除':'減速中'):'前進中'}｜t=${t.toFixed(2)}`;});$('motion-time').value=t;$('motion-caption').textContent='教學事件時間 '+t.toFixed(2)+'；模擬器未描述完整手臂幾何、接觸力或臨床安全。';}
function play(){if(!pair)return;if(timer)clearInterval(timer);let t=0;const max=Math.max(pair.gate.time,pair.open.time);$('motion-time').max=max;paintMotion(t);timer=setInterval(()=>{t=Math.min(max,t+.10);paintMotion(t);if(t>=max){clearInterval(timer);timer=null;}},35);}
function batchHTML(){const b=batch;return `<div class="callout"><b>新產生的教學結果，與上方歷史數值分開。</b><br>種子 ${b.seed}，${b.n} 組情境、${b.n*2} 次執行。僅切換閘門，不含真人複核。</div><div class="table-scroll"><table><thead><tr><th>配置</th><th>完成</th><th>碰撞</th><th>逾時</th><th>全試次均時*</th></tr></thead><tbody>${[['有閘門',b.with_gate],['無閘門',b.without_gate]].map(([n,r])=>`<tr><td>${n}</td><td>${r.success}/${b.n}</td><td>${r.unsafe}/${b.n}</td><td>${r.timeout}/${b.n}</td><td>${r.mean_all_attempt_time.toFixed(2)}</td></tr>`).join('')}</tbody></table></div><p class="note">* 碰撞立即結束，逾時固定為14教學秒；失敗提早結束可能讓原始均時更短，不能據此宣稱效率較佳。</p><div class="endpoints"><span>兩邊都完成 ${b.counts.both_success}</span><span>僅有閘門完成 ${b.counts.gate_only}</span><span>僅無閘門完成 ${b.counts.no_gate_only}</span><span>兩邊未完成 ${b.counts.both_not_success}</span></div>`;}
function bindMedical(){$('motion-case').onchange=e=>{motionKey=e.target.value;};$('latency').oninput=e=>{latency=Number(e.target.value);$('latency-value').textContent=latency.toFixed(2);};$('motion-run').onclick=()=>{pair={gate:Q.simulateMotion(motionKey,true,latency),open:Q.simulateMotion(motionKey,false,latency)};session.results.medical={evidence_kind:'synthetic_2d_teaching_model',scenario:motionKey,latency,with_gate:pair.gate.status,without_gate:pair.open.status};event('paired_motion',{scenario:motionKey,latency});play();};$('motion-pause').onclick=()=>{if(timer)clearInterval(timer);timer=null;};$('motion-replay').onclick=play;$('motion-time').oninput=e=>{if(timer)clearInterval(timer);timer=null;paintMotion(Number(e.target.value));};$('batch-run').onclick=()=>{try{const value=$('seed').value;if(value.trim()==='')throw new Error('請輸入種子');batch=Q.pairedBatch(Number(value),24,latency);session.results.medical=batch;event('paired_batch',{seed:batch.seed,n:batch.n});render();}catch(e){$('motion-error').textContent=e.message;}};$('batch-csv').onclick=()=>{if(!batch)return;const lines=['evidence_kind,seed,scenario_id,event,with_gate_status,without_gate_status,with_gate_time,without_gate_time'];batch.rows.forEach(r=>lines.push(['synthetic_teaching',batch.seed,r.scenario_id,r.kind,r.with_gate.status,r.without_gate.status,r.with_gate.time,r.without_gate.time].join(',')));saveFile('quality-lab-paired-teaching.csv','\ufeff'+lines.join('\n'),'text/csv;charset=utf-8');};if(pair)paintMotion(0);}
const depNames={ready:'可提供',missing_structure:'缺少教案結構',unpublished:'未列入發布',source_mismatch:'來源版本不同',corrupt_media:'檔案損毀被攔截',false_ready:'誤宣告可播放'};
function deployment(){return head('STATION 03','測試通過，也可能沒有驗收使用者的完整流程','依平台已記錄的缺陷，建立28張簡化教案卡。每張只有一個教學檢查單位，不是112組職類任務的完整重建。')+`<div class="grid"><section class="panel"><h2>部署條件</h2><div class="field"><label for="dep-env">執行環境</label><select id="dep-env"><option value="clean" ${depOptions.environment==='clean'?'selected':''}>新機／乾淨安裝</option><option value="developer" ${depOptions.environment==='developer'?'selected':''}>開發者原電腦</option></select></div>${[['coverAll','影片計畫涵蓋全部 28 教案'],['portable','補入 7 份可攜教案結構'],['versionAligned','建置與執行用同一調適快照'],['strictIntegrity','核對媒體完整性（非修復）']].map(([k,l])=>`<label class="check"><input type="checkbox" id="dep-${k}" ${depOptions[k]?'checked':''}>${l}</label>`).join('')}<div class="btn-group"><button class="btn" id="dep-old">只跑舊檢查：9 情境</button><button class="btn primary" id="dep-all">驗收全部 28 教案</button></div><button class="btn teal full" id="dep-fix">套用完整發布修正並驗收</button><div class="btn-group"><button class="btn" id="dep-corrupt">注入一個損毀檔案</button><button class="btn" id="dep-reset">重現原始缺口</button></div><p class="note">故障與修正只修改這個頁面的示例狀態，不會更動您的正式教案或雲端平台。</p></section><div class="stack"><section class="panel"><h2>檢查範圍與實際可用狀態</h2><div id="dep-result">${depResult?deploymentHTML():'<div class="empty">先按「只跑舊檢查」，再驗收全部教案。</div>'}</div><div id="course-detail" class="callout">點選教案卡，可追查缺失原因。</div></section><section class="panel"><h2>這個故事來自哪些已記錄改善？</h2><p>原檢查只涵蓋 9 個新情境，而介面仍可選取 19 個舊教案。後續擴大為 28 教案、103 組職類任務，加上 9 組社工導讀：112 組、336 支影片。</p><p>另補入 7 份只存在本機的教案結構，並以相同來源調適、媒體校驗與乾淨安裝檢查配對。手機端採圖片優先，避免影片或 WebGL 失敗阻斷逐格學習。</p><p class="note">本頁沒有生成或複製336支影片，也不含病患與學員資料。數字是來源文件的歷史記錄。</p>${quiz('deployment','應從哪裡建立發布驗收清單？',['只驗證已經產製的影片清單。','從使用者可達的教案、職類與版本建立清單。'],1,'測試母集合應對應實際使用範圍；校驗能攔截損毀，不能代替內容修復。')}</section></div></div>`;}
function deploymentHTML(){const r=depResult;return `<div class="metrics"><div class="metric"><b>${r.claimed}/${r.checked}</b><span>目前檢查宣告可播</span></div><div class="metric"><b>${r.checked}/28</b><span>驗收涵蓋範圍</span></div><div class="metric"><b>${r.actual}/${r.checked}</b><span>示例中實際可用</span></div></div><div class="callout ${r.releaseAccepted?'success':'warn'}" role="status"><b>${r.releaseAccepted?'完整示例驗收通過':'尚不足以接受完整發布'}</b><br>${!r.scopeComplete?'原檢查只涵蓋9個情境，即使9/9通過，也沒有檢查剩下19個教案。':r.releaseAccepted?'28張卡片符合本教學版的來源與媒體條件；不是正式臨床或裝置驗收。':'查看橘色卡片，分辨未發布、隱藏依賴、來源不符與媒體損毀。'}</div><div class="course-grid">${Array.from({length:28},(_,i)=>{const row=r.rows.find(x=>x.id===i+1);return `<button class="course ${row?(row.status==='ready'?'ready':'issue'):''}" data-course="${i+1}" aria-label="教案 ${i+1}：${row?depNames[row.status]:'未檢查'}">${String(i+1).padStart(2,'0')}<br>${row?(row.status==='ready'?'通過':'缺口'):'未檢'}</button>`;}).join('')}</div><div class="legend"><span>綠：示例可提供</span><span>橘：需處理或誤宣告</span><span>灰：未進入檢查</span></div>`;}
function bindDeployment(){$('dep-env').onchange=e=>{depOptions.environment=e.target.value;depResult=null;render();};['coverAll','portable','versionAligned','strictIntegrity'].forEach(k=>$('dep-'+k).onchange=e=>{depOptions[k]=e.target.checked;depResult=null;render();});function run(scope){depResult=Q.deploymentCheck({...depOptions,scope});session.results.deployment=depResult;event('deployment_check',{scope,options:{...depOptions},accepted:depResult.releaseAccepted});render();}$('dep-old').onclick=()=>run('legacy');$('dep-all').onclick=()=>run('all');$('dep-fix').onclick=()=>{depOptions={...depOptions,coverAll:true,portable:true,versionAligned:true,corrupt:false,strictIntegrity:true};event('apply_release_fix');run('all');};$('dep-corrupt').onclick=()=>{depOptions.corrupt=true;event('inject_media_corruption');run('all');};$('dep-reset').onclick=()=>{depOptions={environment:'clean',coverAll:false,portable:false,versionAligned:false,corrupt:false,strictIntegrity:true};depResult=null;render();};document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{const row=depResult.rows.find(x=>x.id===Number(b.dataset.course));$('course-detail').textContent=row?`${row.name}｜${depNames[row.status]}：${row.reason}`:`教案 ${b.dataset.course} 尚未進入檢查。`;event('inspect_course',{id:Number(b.dataset.course)});});}
function report(){const done=Object.keys(session.results).length;return head('LEARNING RECORD','帶走您的品質判斷紀錄','只記錄此頁的操作與答案；不收集姓名、不上傳資料，也不把活動數轉成正式能力分數。','本機課堂活動')+`<div class="stack"><section class="panel"><div class="metrics"><div class="metric"><b>${done}/3</b><span>已執行體驗</span></div><div class="metric"><b>${session.events.length}</b><span>頁面活動事件</span></div><div class="metric"><b>${Object.values(session.answers).filter(a=>a.correct).length}/3</b><span>目前概念題答對</span></div></div><div class="table-scroll"><table><thead><tr><th>研究案例</th><th>本輪活動</th><th>要帶回現場的問題</th></tr></thead><tbody><tr><td>DrawIQ</td><td>${session.results.drawiq?'已檢查修正適用性':'尚未執行'}</td><td>來源與目標條件是否一致？</td></tr><tr><td>醫療器械</td><td>${session.results.medical?'已執行教學配對':'尚未執行'}</td><td>比較是否保留情境與失敗成本？</td></tr><tr><td>教學平台</td><td>${session.results.deployment?'已執行部署檢查':'尚未執行'}</td><td>測試範圍是否涵蓋使用者流程？</td></tr></tbody></table></div><div class="btn-group screen-only"><button class="btn primary" id="export-json">匯出完整活動 JSON</button><button class="btn" id="print-report">列印／存成 PDF</button><button class="btn" id="clear-session">清除本輪活動</button></div><p class="note">重新整理會清除未匯出的活動。沒有雲端回收表、追蹤程式或背景上傳。</p></section><section class="panel"><h2>操作後自評（選填）</h2><p>回想剛才的體驗：0 代表很低，10 代表很高。這是自製課堂回饋，不是 NASA-TLX、臨床診斷或經驗證量表。</p>${[['mental','理解與判斷負擔'],['physical','操作身體負擔'],['frustration','挫折程度'],['control','知道如何處理問題']].map(([k,l])=>`<div class="rating"><label for="rating-${k}">${l}</label><input id="rating-${k}" type="range" min="0" max="10" value="${session.ratings?session.ratings[k]:5}"><output id="out-${k}">${session.ratings?session.ratings[k]:5}</output></div>`).join('')}<button class="btn" id="save-rating">儲存這次自評到本輪紀錄</button><p id="rating-state" class="note" role="status">${session.ratings?'已記錄自評。':'尚未記錄；預設滑桿值不會自動作為答案。'}</p></section><section class="panel"><h2>講者帶領方式</h2><p><b>第一站：</b>先用上限／下限錯配讓學員做選擇，再切換補強規則。</p><p><b>第二站：</b>先跑及早闖入，再選晚闖入或持續佔區；討論為什麼閘門不代表零失敗。</p><p><b>第三站：</b>先展示9/9通過，再查全部28教案，最後套用修正並注入損毀檔案。</p><div class="callout">共同問題：它省下了什麼工作，又新增了哪些覆核、等待、監督與復原？只有實際對照量測，才能主張人的負荷降低。</div></section></div>`;}
function bindReport(){$('export-json').onclick=()=>saveFile('quality-lab-activity.json',JSON.stringify({...session,exported_at:new Date().toISOString()},null,2));$('print-report').onclick=()=>window.print();$('clear-session').onclick=()=>{if(window.confirm('清除此頁本輪活動？已下載的檔案不受影響。')){session.events=[];session.answers={};session.results={};session.ratings=null;drawResult=null;adoption=null;pair=null;batch=null;depResult=null;render();}};['mental','physical','frustration','control'].forEach(k=>$('rating-'+k).oninput=e=>$('out-'+k).textContent=e.target.value);$('save-rating').onclick=()=>{session.ratings={};['mental','physical','frustration','control'].forEach(k=>session.ratings[k]=Number($('rating-'+k).value));event('optional_feedback',{measure:'unvalidated_classroom_self_report'});$('rating-state').textContent='已記錄；請匯出 JSON 保存。';};}
function sources(){return head('EVIDENCE & OPEN SOURCE','研究證據、互動示例與開源範圍','這份教學版取用鄭淳詩研究中的問題與已記錄摘要，沒有複製未公開客戶圖面、病患資料、模型權重或正式平台。','MIT · 僅本教學程式')+`<div class="sources"><section><h2>D01｜DrawIQ 修正重用</h2><p>依據：DrawIQ_Manuscript_Revised_20261105 與 S2 evidence audit（2026-11-05），封存研究版本0.4.8、2026-10-05機制紀錄。</p><p>歷史記錄包含26個生成圖、20個匹配探針與63個相關API觀察；2個預定匹配和3個語意邊界產生建議，15個排除。這些不是辨識準確率。</p><p>本頁7個案例是重新編寫的最小教學規則；補強開關只在本教學版生效。原稿與受限材料由作者管理，本程式不再發布原始圖面。</p></section><section><h2>M01｜醫療器械配對物理模擬</h2><p>依據：附件四_醫械智取隊_視覺與強化學習_學術技術修訂，2026-11-02，表15與附錄B。</p><p>歷史比較是合成視覺與RRT-Connect控制；每條件300組配對情境。3,000次配置執行不等於3,000個獨立個案。原報均時的成功／失敗分母尚未在本包核對。</p><p>互動動畫及24組批次是新的二維玩具模型，未配適歷史百分比；不含MuJoCo、PPO、實體機器人、真實碰撞或力學驗證。</p></section><section><h2>T01｜教學平台影片部署</h2><p>依據：spiral-clinical-tutor-v5，〈v5.6.3 講師影片配對與部署修正〉，2026-10-24，固定程式版本 ce0c7cb764a26fb7bc68bdab813d88c47bef7e45。</p><p>記錄9個新情境、19個舊教案的覆蓋缺口；其後28教案、112組／336影片，並補入7份可攜教案結構。此頁以28張合成卡片說明缺陷，沒有複製正式教材。</p><a href="https://github.com/poemcheng/spiral-clinical-tutor-v5/blob/ce0c7cb764a26fb7bc68bdab813d88c47bef7e45/README.md" target="_blank" rel="noopener">查閱原平台公開文件 ↗</a></section><section><h2>開源與離線使用</h2><p>本教學程式採MIT授權；上游研究、第三方素材與原平台仍保留各自授權。您可保留授權聲明後修改及再部署本教學程式。</p><div class="btn-group"><a class="btn primary" href="https://github.com/poemcheng/poem/tree/master/quality-collaboration-lab" target="_blank" rel="noopener">GitHub 原始碼</a><a class="btn" href="./source.zip" download>下載本版原始碼 ZIP</a><button class="btn" id="download-offline">下載可離線使用的 HTML</button><a class="btn" href="./docs/GUIDE.md" target="_blank" rel="noopener">講者與學員指引</a></div><p class="note">HTML不依賴CDN、帳號或金鑰。頁內互動不向外送資料；點選外部GitHub連結時才連往外站。本版未覆寫原Sites網站或正式研究專案。</p></section></div>`;}
