name: Deploy RailSlope, Campus Quest and Quality Collaboration Lab
on:
  push:
    branches: ["master"]
    paths:
      - "railslope-ai/**"
      - "campus-quest-v2/**"
      - ".deployment/campus-quest-v2/**"
      - "quality-collaboration-lab/**"
      - ".deployment/quality-collaboration-lab/**"
      - ".github/workflows/railslope-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore hash-verified Campus Quest source
        run: python .deployment/campus-quest-v2/restore.py
      - name: Build hash-verified Quality Collaboration Lab
        run: python .deployment/quality-collaboration-lab/prepare.py
      - name: Install material and browser tooling
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.2.1 playwright==1.57.0
      - name: Build authored material maps
        run: |
          if [ ! -s campus-quest-v2/assets/materials.js ]; then
            python campus-quest-v2/tools/generate_materials.py
          fi
      - name: Validate spatial physics and JavaScript
        run: |
          node campus-quest-v2/tests/spatial.test.cjs
          find campus-quest-v2/src campus-quest-v2/data -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test Quality Lab rules and paired model
        run: |
          mkdir -p quality-collaboration-lab/verification
          node --check quality-collaboration-lab/app.js
          node --test quality-collaboration-lab/tests/core.test.cjs | tee quality-collaboration-lab/verification/unit-tests.txt
      - name: Install verification browser
        run: python -m playwright install --with-deps chromium
      - name: Verify Quality Lab interactions over HTTP
        run: python quality-collaboration-lab/tests/browser_test.py
      - name: Keep editable sources and material maps in the repository
        run: |
          git add campus-quest-v2 .deployment/campus-quest-v2/source.part* quality-collaboration-lab
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Materialize verified sources and quality lab release [skip ci]"
            git push origin HEAD:master || echo "::warning::Generated sources were built but could not be saved back; deployment continues from verified build."
          fi
      - name: Assemble site preserving RailSlope root
        run: python .deployment/campus-quest-v2/prepare.py
      - name: Add isolated Quality Lab without changing existing site roots
        run: cp -a quality-collaboration-lab _site/quality-collaboration-lab
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify anonymous Quality Lab HTTPS and browser interactions
        run: python quality-collaboration-lab/tests/live_test.py "${{ steps.deployment.outputs.page_url }}quality-collaboration-lab/"
      - name: Verify live HTTPS site and real browser rendering
        run: python .deployment/campus-quest-v2/check_live.py "${{ steps.deployment.outputs.page_url }}"
      - name: Save live verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-quest-live-verification
          path: verification/
          if-no-files-found: ignore
      - name: Save Quality Lab verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-lab-verification
          path: |
            quality-collaboration-lab/verification/
            verification/quality-lab-*
          if-no-files-found: ignore
