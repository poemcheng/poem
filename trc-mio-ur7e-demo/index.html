<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRC 智慧物流｜MIO AMR + UR7e</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#eaf7ff;font-family:system-ui,"Microsoft JhengHei",sans-serif}canvas{display:block}.panel{position:fixed;z-index:3;background:#0b1b29dd;border:1px solid #28506a;border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 12px 30px #0008}.head{left:16px;top:16px;padding:12px 16px}.head b{font-size:18px}.head div{font-size:11px;color:#9cc0d2;margin-top:4px}.ctrl{left:16px;bottom:16px;width:min(620px,calc(100% - 32px));padding:12px}.row{display:flex;gap:8px}.row input{flex:1;background:#06121c;border:1px solid #2d5b75;color:white;border-radius:9px;padding:11px}.row button,.chip{border:1px solid #306079;background:#123148;color:#eaf7ff;border-radius:9px;padding:9px 11px;cursor:pointer}.go{background:#087c7a!important}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;padding:6px 8px}.status{right:16px;top:16px;width:260px;padding:12px;font-size:12px}.status h3{margin:0 0 8px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}.kv div{background:#071925;padding:8px;border-radius:8px}.kv small{display:block;color:#89adbf}.log{margin-top:8px;height:100px;overflow:auto;background:#06131d;border-radius:8px;padding:7px;font:10px ui-monospace,monospace}.stop{position:fixed;right:22px;bottom:22px;z-index:4;width:68px;height:68px;border-radius:50%;border:6px solid #ff7b8e;background:#c51f39;color:#fff;font-weight:900;cursor:pointer}.label{position:fixed;z-index:2;pointer-events:none;transform:translate(-50%,-50%);background:#23dfc3;color:#06382f;border-radius:7px;padding:4px 8px;font-weight:900}.label small{display:block;font-size:8px}@media(max-width:800px){.status{display:none}.head{right:16px}.stop{bottom:180px}}
</style>
</head>
<body>
<div class="panel head"><b>TRC 智慧物流｜MIO AMR + UR7e</b><div>Three.js A–E 競賽場地 · 文字／語音任務控制 · Participant B Demo</div></div>
<div class="panel status"><h3>Digital Twin</h3><div class="kv"><div><small>Mode</small><b id="mode">IDLE</b></div><div><small>Zone</small><b id="zone">START</b></div><div><small>Speed</small><b id="speed">0.00 m/s</b></div><div><small>Battery</small><b id="battery">96%</b></div></div><div id="log" class="log"></div></div>
<div class="panel ctrl"><div class="row"><input id="cmd" placeholder="例：前往 E 區抓取紅色箱子並送到 D 區"><button id="mic">🎙</button><button id="go" class="go">執行</button></div><div class="chips"><button class="chip">執行參賽機器B正式流程</button><button class="chip">前往A區</button><button class="chip">前往B區</button><button class="chip">前往C區</button><button class="chip">前往D區</button><button class="chip">前往E區抓取紅色箱子</button><button class="chip">完整demo</button><button class="chip">回到起點</button></div></div>
<button id="stop" class="stop">E-STOP</button>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(()=>{if(!window.THREE){alert('Three.js 載入失敗');return}const $=id=>document.getElementById(id),logEl=$('log'),mode=$('mode'),zoneEl=$('zone'),speedEl=$('speed'),batEl=$('battery');let halted=false,battery=96,target=null,task=null,carry=null;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111d);scene.fog=new THREE.FogExp2(0x07111d,.022);const cam=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100),ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);scene.add(new THREE.HemisphereLight(0xcdefff,0x162b18,1.25));const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(8,15,7);sun.castShadow=true;scene.add(sun);
let th=.85,ph=.9,rad=25,drag=false,lx=0,ly=0;function camera(){cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,0,0)}camera();ren.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=false;onpointermove=e=>{if(!drag)return;th-=(e.clientX-lx)*.006;ph=Math.max(.25,Math.min(1.45,ph+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;camera()};ren.domElement.onwheel=e=>{rad=Math.max(12,Math.min(38,rad+e.deltaY*.015));camera()};
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.7});function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}box(20,.2,13,0x2a343b,0,-.12,0);scene.add(new THREE.GridHelper(20,40,0x31596b,0x1b3541));box(20.4,.25,.25,0x2e783b,0,.12,-6.5);box(20.4,.25,.25,0x2e783b,0,.12,6.5);box(.25,.25,13,0x2e783b,-10.1,.12,0);box(.25,.25,13,0x2e783b,10.1,.12,0);
const Z={A:[-6.8,3.8,'窄道/靜態避障'],B:[-7,-2.7,'斜坡搬運'],C:[1,-4,'動態避障'],D:[3.7,1,'出貨準備'],E:[7.3,.2,'視覺抓取']};for(const [k,v] of Object.entries(Z)){const p=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.6),new THREE.MeshBasicMaterial({color:0x19a999,transparent:true,opacity:.3,side:2}));p.rotation.x=-Math.PI/2;p.position.set(v[0],.02,v[1]);scene.add(p);const d=document.createElement('div');d.className='label';d.innerHTML=k+'<small>'+v[2]+'</small>';document.body.appendChild(d);v.push(d)}
box(.25,.8,4.2,0x7b5834,-8.1,.4,3.5);box(.25,.8,4.2,0x7b5834,-5.5,.4,3.5);box(.6,.6,.6,0x818c91,-6.6,.3,3.1);box(.5,.45,.5,0xa0a8ab,-7.3,.24,4.1);const ramp=box(3.3,.25,2,0xb87939,-7,.35,-2.7);ramp.rotation.z=-.16;for(let i=0;i<3;i++)box(.65,.65,.65,0xdccf82,-.8+i*1.8,.33,-4);const mover=box(.7,.8,.7,0xffc857,2.8,.4,-4);box(2,.18,1.5,0xc47732,3.7,.1,1);for(let i=0;i<3;i++)box(.55,.5,.55,0x417180,3.1+i*.6,.42,1);box(3.5,.75,1.1,0x536976,7.2,.38,-1.9);const red=box(.45,.45,.45,0xd94858,6.5,1,-1.9),blue=box(.45,.45,.45,0x3f7de0,7.2,1,-1.9),yellow=box(.45,.45,.45,0xe7c54b,7.9,1,-1.9);box(1.2,.7,1.1,0x365f6d,8.3,.35,2.1);
const robot=new THREE.Group();scene.add(robot);robot.position.set(-2.8,.12,5.1);const base=new THREE.Mesh(new THREE.BoxGeometry(1.35,.38,.92),mat(0xe5eef1));base.position.y=.32;robot.add(base);const belt=new THREE.Mesh(new THREE.BoxGeometry(1.38,.12,.96),mat(0x123f82));belt.position.y=.23;robot.add(belt);for(const x of [-.48,.48])for(const z of [-.35,.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.11,16),mat(0x111820));w.rotation.z=Math.PI/2;w.position.set(x,.1,z);robot.add(w)}
const arm=new THREE.Group();arm.position.y=.62;robot.add(arm);const links=[];let parent=arm;for(const [len,r] of [[.34,.12],[.5,.1],[.44,.085],[.28,.07],[.2,.06]]){const j=new THREE.Group();parent.add(j);const s=new THREE.Mesh(new THREE.SphereGeometry(r*1.35,16,10),mat(0xcbd9df));j.add(s);const l=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,16),mat(0x124587));l.position.y=len/2;j.add(l);const tip=new THREE.Group();tip.position.y=len;j.add(tip);links.push(j);parent=tip}const grip=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.18),mat(0x17232c));parent.add(grip);
const path={START:[-2.8,5.1],A:[-6.8,3.8],B:[-7,-2.7],C:[1,-4],D:[3.7,1],E:[7.3,.2]};function log(s){const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false})+' '+s;logEl.prepend(d)}function setMode(s){mode.textContent=s}function go(z){if(halted)return;target=z;setMode('NAVIGATING');log('前往 '+z+' 區')}function challenge(z){if(z==='E'){task='pick';setMode('VISION + PICK');log('E區：辨識紅色物件，UR7e 執行抓取')}else{setMode(z+' CHALLENGE');log(z+'區：'+Z[z][2]+' 挑戰')}}
function command(t){t=t.trim();if(!t)return;if(/停止|急停/i.test(t)){halted=true;target=null;setMode('E-STOP');log('緊急停止');return}if(/重置/i.test(t)){halted=false;robot.position.set(-2.8,.12,5.1);zoneEl.textContent='START';setMode('IDLE');return}if(/正式流程|機器B/.test(t)){seq(['E','PICK','D']);return}if(/完整/i.test(t)){seq(['A','B','C','D','E']);return}if(/回到?起點/.test(t)){go('START');return}const m=t.match(/([ABCDE])\s*區/i);if(m){go(m[1].toUpperCase());if(/抓|辨識|分揀/.test(t))task='afterE';return}log('無法解析：'+t)}
async function seq(a){if(task==='sequence')return;task='sequence';for(const s of a){while(halted)await new Promise(r=>setTimeout(r,200));if(s==='PICK'){challenge('E');await new Promise(r=>setTimeout(r,2200));continue}go(s);while(target)await new Promise(r=>setTimeout(r,100));challenge(s);await new Promise(r=>setTimeout(r,900))}task=null;setMode('MISSION COMPLETE');log('任務完成')}
$('go').onclick=()=>command($('cmd').value);$('cmd').onkeydown=e=>{if(e.key==='Enter')$('go').click()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('cmd').value=b.textContent;command(b.textContent)});$('stop').onclick=()=>{halted=!halted;if(halted){target=null;setMode('E-STOP');log('E-STOP ON')}else{setMode('IDLE');log('E-STOP RELEASED')}};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang='zh-TW';r.onresult=e=>{$('cmd').value=e.results[0][0].transcript;command($('cmd').value)};$('mic').onclick=()=>r.start()}else $('mic').disabled=true;
let t=0;function frame(){requestAnimationFrame(frame);t+=.016;mover.position.z=-4+Math.sin(t*1.4)*1.3;if(target&&!halted){const p=path[target],dx=p[0]-robot.position.x,dz=p[1]-robot.position.z,d=Math.hypot(dx,dz),v=Math.min(.035,d);if(d<.08){robot.position.set(p[0],.12,p[1]);zoneEl.textContent=target;target=null;speedEl.textContent='0.00 m/s';log('到達 '+zoneEl.textContent+' 區');if(task==='afterE'&&zoneEl.textContent==='E'){task='pick';challenge('E')}}else{robot.position.x+=dx/d*v;robot.position.z+=dz/d*v;robot.rotation.y=Math.atan2(dx,dz);speedEl.textContent='1.20 m/s';battery=Math.max(15,battery-v*.02);batEl.textContent=battery.toFixed(0)+'%'}}if(task==='pick'){links[1].rotation.z=-.8+Math.sin(t*2)*.15;links[2].rotation.z=1.1;red.position.y=.9+Math.abs(Math.sin(t*2))*.4;if(Math.sin(t*2)>.92){red.position.set(8.3,1,2.1);task=null;setMode('PICK COMPLETE');log('紅色物件已分揀')}}for(const [k,v] of Object.entries(Z)){const q=new THREE.Vector3(v[0],1.1,v[1]).project(cam);v[3].style.left=(q.x*.5+.5)*innerWidth+'px';v[3].style.top=(-q.y*.5+.5)*innerHeight+'px'}ren.render(scene,cam)}frame();window.onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)};log('Demo ready');})();
</script>
</body></html>
